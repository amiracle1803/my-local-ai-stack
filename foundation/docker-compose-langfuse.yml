# Langfuse (self-hosted v2): real LLM-call tracing/observability for
# Agent Atlas -- latency, cost estimate, replay, per-agent breakdown.
# Optional. Separate compose file from n8n's (independent lifecycles --
# n8n has no reason to restart when this does or vice versa).
#
# Start:  docker compose -f docker-compose-langfuse.yml up -d
# UI:     http://localhost:3030  (first run: sign up locally, no email needed)
services:
  langfuse-db:
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_local_dev
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: docker.io/langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3030:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_local_dev@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3030
      NEXTAUTH_SECRET: agent-atlas-local-dev-nextauth-secret-change-if-exposed
      SALT: agent-atlas-local-dev-salt-change-if-exposed
      TELEMETRY_ENABLED: "false"
      # Headless bootstrap -- creates a user/org/project/API-key pair on
      # first boot so Agent Atlas has working credentials without anyone
      # clicking through the setup wizard. Local-only, not a real secret.
      LANGFUSE_INIT_ORG_ID: agent-atlas-org
      LANGFUSE_INIT_ORG_NAME: Agent Atlas
      LANGFUSE_INIT_PROJECT_ID: agent-atlas
      LANGFUSE_INIT_PROJECT_NAME: agent-atlas
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-agent-atlas-local-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-agent-atlas-local-dev
      LANGFUSE_INIT_USER_EMAIL: local@agent-atlas.local
      LANGFUSE_INIT_USER_NAME: Local
      LANGFUSE_INIT_USER_PASSWORD: agent-atlas-local-dev-password

volumes:
  langfuse_pg_data:
