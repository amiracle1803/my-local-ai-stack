[pytest]
cache_dir = .hidden/.pytest_cache
# only this project's own tests; vendored projects (.aitk, tools-external/sd-scripts,
# harness-deepseek) have their own dependencies and test suites
testpaths = olympus
norecursedirs = .opencode .aitk tools-external harness-deepseek _archive hf_cache models .venv node_modules .hidden .git
