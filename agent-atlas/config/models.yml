models:
  # ── Local auto-discovered (checked in order, first reachable wins) ──────────
  ollama_local:
    provider: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    model: gemma2:9b
    capabilities: [general, coding, reasoning, cheap, fast]
    max_tokens: 4096
    temperature: 0.7

  lmstudio_local:
    provider: local
    endpoint: http://127.0.0.1:1234/v1/chat/completions
    model: google/gemma-4-e4b
    capabilities: [general, coding, reasoning, cheap]
    max_tokens: 4096
    temperature: 0.7

  # ── Groq cloud — free tier, works when your computer is off ─────────────────
  # Sign up free: https://console.groq.com → API Keys
  groq_fast:
    provider: groq
    api_key_env: GROQ_API_KEY
    model: llama-3.1-8b-instant
    capabilities: [general, fast, cloud]
    max_tokens: 8192
    temperature: 0.7

  groq_powerful:
    provider: groq
    api_key_env: GROQ_API_KEY
    model: llama-3.3-70b-versatile
    capabilities: [reasoning, coding, complex_writing, cloud]
    max_tokens: 8192
    temperature: 0.5

routing:
  # Auto-discovery priority — system probes each in order, picks first available
  discovery_order:
    - ollama_local
    - lmstudio_local
    - groq_powerful
    - groq_fast

# ── Embedding model (for Obsidian vault indexing and semantic search) ─────────
# NOTE: This section is for documentation only — it is NOT parsed by ConfigLoader.
# Set EMBEDDING_ENDPOINT and EMBEDDING_MODEL in your .env file instead.
# If the endpoint is unreachable at startup, ChromaDB falls back to its
# built-in sentence-transformers embedder (requires pip install chromadb[default]).
embeddings:
  provider: lmstudio
  endpoint: http://127.0.0.1:1234/v1/embeddings    # → EMBEDDING_ENDPOINT in .env
  model: text-embedding-nomic-embed-text-v1.5       # → EMBEDDING_MODEL in .env
