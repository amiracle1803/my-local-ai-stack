version: "3.9"

services:
  agent-atlas:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist database, embeddings, and exports across restarts
      - ./data:/app/data
      # Hot-reload config changes without rebuilding
      - ./config:/app/config
    environment:
      # ── LLM (pick whichever you have) ──────────────────────────────────────
      # Groq cloud (free, works 24/7 even when your PC is off)
      - GROQ_API_KEY=${GROQ_API_KEY:-}

      # If Ollama runs on your HOST machine (not inside Docker):
      # Override the endpoint so the container can reach it
      - AGENT_ATLAS_OLLAMA_LOCAL_ENDPOINT=http://host.docker.internal:11434/v1/chat/completions
      - AGENT_ATLAS_LMSTUDIO_LOCAL_ENDPOINT=http://host.docker.internal:1234/v1/chat/completions

      # ── Optional ────────────────────────────────────────────────────────────
      - OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH:-}
      - LOG_LEVEL=INFO

    # Reach host machine services (Ollama/LM Studio) from inside the container
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
