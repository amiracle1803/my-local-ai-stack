id: observability_agent
display_name: Observability Agent
layer: platform
description: Captures and exposes metrics, traces, and error logs for all agents.

model_preference:
  - hermes_local

inputs:
  - op
  - agent_id
  - metric
  - value

outputs:
  - metrics
  - traces

tools: []
memory_scopes: []
policies: []

system_prompt: |
  You are the Observability Agent. Record and surface metrics and traces for all agent calls.
  Expose summaries to the frontend dashboard.
