id: retrieval_agent
display_name: Retrieval Agent
layer: knowledge
description: Performs hybrid semantic + keyword retrieval from local vector store and SQLite.

model_preference:
  - hermes_local

inputs:
  - query
  - collection
  - top_k

outputs:
  - results

tools:
  - vector_store.query
  - sqlite_fts.search

memory_scopes: []

policies:
  - local_data_only

system_prompt: |
  You are a retrieval agent. Combine vector similarity search and keyword search
  to return the most relevant local documents for a query.
