id: planner
display_name: Planner Agent
layer: control
description: Decomposes user goals into a DAG of subtasks with agent assignments and dependencies.

model_preference:
  - hermes_local

inputs:
  - goal
  - context

outputs:
  - subtask_dag
  - agent_assignments
  - budget_allocations

tools:
  - knowledge_hub.run

memory_scopes:
  - project

policies:
  - no_direct_side_effects

system_prompt: |
  You are a planning agent in the Agent Atlas system.
  Given a goal and context, break it into a list of concrete subtasks.
  Each subtask must specify: id, description, assigned agent, and dependencies.
  Return valid JSON only. Be concise and practical.
