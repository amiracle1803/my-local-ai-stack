<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Local AI Stack{% endblock %}</title>
<style>
  :root{
    --bg:#15151F; --panel:rgba(31,31,43,.55); --panel2:rgba(31,31,43,.75);
    --border:rgba(255,255,255,.105); --border-strong:rgba(255,255,255,.18);
    --violet:#8B5CF6; --violet-glow:#A78BFA; --cyan:#7DD3FC; --mint:#5EE2B5;
    --amber:#F5B544; --red:#F26D6D; --pink:#F472B6;
    --text:#F4F4F8; --muted:#8A8A9B;
    --heading:-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,"JetBrains Mono",monospace;
    --blur:26px; --nav-h:64px;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;font-family:var(--heading);color:var(--text);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 46% 50% at 6% 0%, rgba(139,92,246,.20), rgba(139,92,246,.07) 34%, rgba(21,21,31,0) 62%),
      radial-gradient(ellipse 34% 40% at 96% 20%, rgba(125,211,252,.15), rgba(125,211,252,.05) 37%, rgba(21,21,31,0) 68%),
      var(--bg);
  }
  a{color:inherit}
  .top-nav{
    position:sticky;top:0;z-index:30;height:var(--nav-h);display:grid;
    grid-template-columns:auto auto 1fr;align-items:center;gap:28px;padding:0 26px;
    background:linear-gradient(180deg,rgba(21,21,31,.85),rgba(21,21,31,.55));
    backdrop-filter:blur(var(--blur)) saturate(150%);border-bottom:1px solid var(--border);
  }
  .brand{font-weight:750;font-size:1rem;display:flex;align-items:center;gap:.55rem;letter-spacing:-.01em;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px rgba(94,226,181,.7);animation:pulse 2.2s ease-out infinite;flex:0 0 auto}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,226,181,.4),0 0 10px rgba(94,226,181,.7)}70%{box-shadow:0 0 0 8px rgba(94,226,181,0),0 0 12px rgba(94,226,181,.8)}100%{box-shadow:0 0 0 0 rgba(94,226,181,0),0 0 10px rgba(94,226,181,.7)}}
  .dot.warn{background:var(--amber);box-shadow:0 0 10px rgba(245,181,68,.6);animation:none}
  .dot.bad{background:var(--red);box-shadow:0 0 10px rgba(242,109,109,.6);animation:none}
  .tabs{display:flex;align-items:center;gap:3px;padding:4px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
  .navitem{padding:8px 15px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
  .navitem.active{background:rgba(255,255,255,.92);color:#15151F}
  .navitem:hover:not(.active){color:var(--text);background:rgba(255,255,255,.05)}
  .nav-right{justify-self:end;display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
  main{padding:1.6rem 2rem 3rem;max-width:1520px;margin:0 auto;width:100%}
  .eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.16em;font-size:.66rem;font-weight:700;color:var(--cyan);margin:0 0 .35rem}
  h1{font-size:1.55rem;margin:0 0 .25rem;font-weight:650;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.86rem;margin:0 0 1.2rem}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.3rem}
  .grid.c6{grid-template-columns:repeat(6,1fr)}
  .stat{
    background:var(--panel);border:1px solid var(--border);border-top:2px solid var(--stat-color,var(--cyan));
    border-radius:12px;padding:.85rem 1rem;backdrop-filter:blur(var(--blur)) saturate(140%);
    box-shadow:0 14px 34px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.04);
  }
  .stat .label{color:var(--muted);font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.09em}
  .stat .val{font-size:1.05rem;font-weight:700;margin-top:.3rem;display:flex;align-items:center;gap:.4rem;color:var(--stat-color,var(--text))}
  .pill{font-size:.62rem;padding:.15rem .5rem;border-radius:999px;font-weight:700;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
  .pill.ok{background:rgba(94,226,181,.14);color:var(--mint);border:1px solid rgba(94,226,181,.28)}
  .pill.bad{background:rgba(242,109,109,.14);color:var(--red);border:1px solid rgba(242,109,109,.28)}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:1.15rem 1.3rem;margin-bottom:.9rem;
    backdrop-filter:blur(var(--blur)) saturate(140%);box-shadow:0 20px 48px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.04);
    position:relative;overflow:hidden;
  }
  .card::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 30%)}
  .card h2{margin:0 0 .8rem;font-size:.92rem;font-weight:650;position:relative}
  .card>*{position:relative}
  textarea{width:100%;min-height:100px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;color:var(--text);padding:.8rem;font-size:.9rem;resize:vertical;font-family:inherit}
  textarea:focus,select:focus{outline:none;border-color:rgba(167,139,250,.5);box-shadow:0 0 0 3px rgba(167,139,250,.12)}
  .row{display:flex;gap:.55rem;align-items:center;margin-top:.7rem;flex-wrap:wrap}
  button{background:var(--violet-glow);color:#15151F;border:0;padding:.55rem 1.05rem;border-radius:9px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.03em;text-transform:uppercase}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text)}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:.45rem;font-family:inherit}
  .list{display:flex;flex-direction:column;gap:.45rem}
  .item{display:flex;justify-content:space-between;align-items:center;padding:.6rem .85rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;font-size:.84rem;text-decoration:none;transition:.15s}
  .item:hover{background:rgba(255,255,255,.06);border-color:var(--border-strong)}
  .item .meta{color:var(--muted);font-size:.72rem;font-family:var(--mono)}
  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:1rem}
  .three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
  .empty{color:var(--muted);font-size:.82rem;padding:.4rem 0}
  .flash{background:rgba(94,226,181,.1);border:1px solid rgba(94,226,181,.3);color:var(--mint);padding:.7rem 1rem;border-radius:11px;margin-bottom:1rem;font-size:.85rem}
  .flash.error{background:rgba(242,109,109,.1);border-color:rgba(242,109,109,.3);color:var(--red)}
  .result{border:1px solid var(--border);border-radius:13px;padding:1.1rem 1.2rem;background:var(--panel2);white-space:pre-wrap;font-size:.88rem;line-height:1.55}
  .tag{display:inline-block;font-size:.65rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:.18rem .55rem;border-radius:999px;background:rgba(139,92,246,.18);color:var(--violet-glow);border:1px solid rgba(139,92,246,.3);margin-bottom:.6rem}
  .prose{line-height:1.6;font-size:.9rem}
  .prose h1,.prose h2,.prose h3{margin-top:1.3em}
  .prose code{background:var(--panel2);padding:.1em .4em;border-radius:5px;font-size:.87em;color:var(--mint)}
  .prose pre{background:rgba(5,6,12,.4);border:1px solid var(--border);padding:.9rem;border-radius:11px;overflow-x:auto}
  .prose a{color:var(--cyan)}
  .prose blockquote{border-left:3px solid var(--border);margin:0;padding-left:1rem;color:var(--muted)}
  .backlink{color:var(--muted);text-decoration:none;font-size:.82rem;display:inline-block;margin-bottom:.8rem}
  .backlink:hover{color:var(--text)}
  form.inline{display:inline}
  /* agent-style / integration cards */
  .agent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.85rem;margin-bottom:1.3rem}
  .agent-card{background:var(--panel);border:1px solid var(--border);border-top:2px solid var(--agent-color,var(--cyan));border-radius:14px;padding:1.05rem 1.15rem;backdrop-filter:blur(var(--blur)) saturate(140%);box-shadow:0 16px 38px rgba(0,0,0,.18)}
  .agent-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
  .agent-name{font-size:.94rem;font-weight:700;margin:0}
  .agent-desc{color:var(--muted);font-size:.78rem;line-height:1.4;min-height:2.1em;margin-bottom:.8rem}
  .agent-when{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .agent-link{font-family:var(--mono);font-size:.68rem;color:var(--cyan);text-decoration:none;letter-spacing:.03em}
  .agent-link:hover{text-decoration:underline}
  /* activity feed */
  .feed-row{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--border)}
  .feed-row:last-child{border-bottom:none}
  .feed-badge{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:.6rem;padding:.18rem .45rem;border-radius:6px;background:rgba(125,211,252,.12);border:1px solid rgba(125,211,252,.25);color:var(--cyan);white-space:nowrap}
  .feed-desc{font-size:.82rem;color:rgba(244,244,248,.86);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .feed-time{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap}
  @media(max-width:900px){
    .top-nav{grid-template-columns:1fr;height:auto;padding:12px;gap:8px}
    .tabs{flex-wrap:wrap;justify-content:center}
    .nav-right{justify-self:center}
    .grid,.grid.c6,.two-col,.three-col{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <nav class="top-nav">
    <div class="brand"><span class="dot"></span> Local AI Stack</div>
    <div class="tabs">
      <a class="navitem {{ 'active' if active=='dashboard' else '' }}" href="/">Dashboard</a>
      <a class="navitem {{ 'active' if active=='tasks' else '' }}" href="/tasks">Tasks</a>
      <a class="navitem {{ 'active' if active=='automation' else '' }}" href="/automation">Automation</a>
      <a class="navitem {{ 'active' if active=='reviews' else '' }}" href="/reviews">Knowledge</a>
      <a class="navitem {{ 'active' if active=='integrations' else '' }}" href="/integrations">Integrations</a>
    </div>
    <div class="nav-right"><span class="dot"></span> operational</div>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ 'error' if category=='error' else '' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
