# Local AI Stack — unified configuration
# Single source of truth. Every service and script reads from this file.

[stack]
name = "my-local-ai-stack"
version = "3.0.0"

# ── Ollama ────────────────────────────────────────────────────────────────
[ollama]
host = "127.0.0.1"
port = 11434
url = "http://127.0.0.1:11434"
timeout_seconds = 600
# Context window for pipeline LLM calls. Ollama's vram-based default (4096)
# is too small for the stage 0-2 prompts + JSON output; 16k is a good balance
# on 8GB VRAM (qwen3:8b offloads a few layers to CPU, still usable).
num_ctx = 16384

# Model roles — change these to swap models without touching code
[ollama.models]
script    = "ornith-1.5-9b-fast:latest" # installed local model for structured story work
vision = "qwen2.5vl:7b"       # panel vision judge — must be a VLM (qwen3:8b rejects image payloads with 400; qwen2.5vl occasionally miscounts dense panels but retry cap accepts best attempt)
review    = "qwen2.5vl:7b"       # stage_vlm_review 10-dim physics/logic gate (non‑reasoning; reliable fast structured output — qwen3‑vl:8b reasoning model returns empty content on some frames)
default   = "ornith-1.5-9b-fast:latest" # installed local fallback
embed     = "nomic-embed-text"   # embeddings

# Agent roles — maps kernel agent roles → Ollama models
[ollama.agents]
triage   = "llama3.2:3b"
worker   = "ornith-1.5-9b-fast:latest"
planner  = "ornith-1.5-9b-fast:latest"
verifier = "llama3.2:3b"
jarvis   = "ornith-1.5-9b-fast:latest"

# ── ComfyUI ───────────────────────────────────────────────────────────────
[comfyui]
host = "127.0.0.1"
port = 8188
url = "http://127.0.0.1:8188"

# Image models (GGUF in ComfyUI/models/unet/) — all LOCAL, 8GB-tested
[comfyui.models]
primary            = "flux-2-klein-4b-Q4_K_M.gguf" # 8GB-safe primary (2.5GB GGUF, Flux2-klein, verified stable on RTX 4070 8GB). krea2 segfaults under heavy load on this card.
fallback = "flux-2-klein-4b-Q4_K_M.gguf" # 8GB-safe fallback (same file — no OOM fallback needed)
floor      = "flux-2-klein-4b-Q4_K_M.gguf"     # acceptable quality
panel               = "flux-2-klein-4b-Q4_K_M.gguf" # panel gen (flux-2-klein — krea2 unstable on 8GB)
character = "flux-2-klein-4b-Q4_K_M.gguf" # character sheets (flux-2-klein — krea2 unstable on 8GB)
animation_primary = "ltx-2.3-22b-distilled-1.1-Q4_K_M.gguf" # 17GB GGUF but validated 8GB-safe via tiled VAE (768x448x81f ~5.8GB per manifest ltx22b_i2v.json) — hunyuan 7.4GB is fallback

# Banned checkpoints — enforced at runtime by pipeline.config.resolve_image_model
banned_checkpoints = [
  "z-anime-distill-4step-fp8",
  "wai-illustrious-v110",
  "NoobAI-XL-v1.1",
  "animagine-xl-4.0",
  "FLUX.1-Krea-dev",
]

# ── Voice Studio ──────────────────────────────────────────────────────────
[voice]
engine = "auto" # auto selects Kokoro when healthy, otherwise local espeak-ng
default_voice = "af_heart"
default_speed = 1.0

# ── Olympus Kernel ────────────────────────────────────────────────────────
[kernel]
core_agents = ["jarvis", "archivist", "plutus", "conductor"]

# ── OpenCode MCP ──────────────────────────────────────────────────────────
[mcp]

# ── Open WebUI ────────────────────────────────────────────────────────────
[webui]

# ── llama.cpp server (optional) ───────────────────────────────────────────
[llamacpp]
enabled = false

# ── Pipeline ──────────────────────────────────────────────────────────────
[pipeline]
projects_dir = "olympus/engines/pipeline/projects"
loras_dir    = "olympus/engines/pipeline/loras"
workflows    = "olympus/engines/pipeline/workflows"
comfyui_dir  = "ComfyUI"

# Capability-based provider routing. Local providers are the default; hosted
# providers are opt-in and may be added to [providers.registry] later.
[providers]
llm = { provider = "ollama" }
vision = { provider = "ollama" }
t2i = { provider = "comfyui" }
i2i = { provider = "comfyui" }
i2v = { provider = "comfyui" }
tts = { provider = "voice_studio" }

[providers.registry.ollama]
display_name = "Ollama"
kind = "local"
capabilities = ["llm", "vision"]
endpoint = "http://127.0.0.1:11434"

[providers.registry.comfyui]
display_name = "ComfyUI"
kind = "local"
capabilities = ["t2i", "i2i", "i2v"]
endpoint = "http://127.0.0.1:8188"

[providers.registry.voice_studio]
display_name = "Voice Studio"
kind = "local"
capabilities = ["tts"]
endpoint = "http://127.0.0.1:5050"

[providers.registry.nvidia_nim]
display_name = "NVIDIA NIM"
kind = "hosted"
enabled = true
experimental = true
credential_env = "NVIDIA_API_KEY"
capabilities = ["llm", "vision"]
endpoint = "https://integrate.api.nvidia.com/v1"
models = ["deepseek-ai/deepseek-v4-pro-0813", "meta/llama-3.2-11b-vision-instruct"]

[providers.registry.huggingface_inference]
display_name = "Hugging Face Inference Providers"
kind = "hosted"
enabled = true
experimental = true
credential_env = "HF_TOKEN"
capabilities = ["t2i", "i2i"]
endpoint = "https://router.huggingface.co"
models = ["black-forest-labs/FLUX.1-schnell", "stabilityai/stable-diffusion-xl-base-1.0"]
integration_status = "experimental"
billing_note = "Free account/token tier is quota-limited; provider/model availability and quotas can change."
availability_note = "Official HF Inference Providers path; generation adapter is opt-in and not the local default."

[providers.registry.huggingface_video]
display_name = "Hugging Face Video Providers"
kind = "hosted"
enabled = false
experimental = true
credential_env = "HF_TOKEN"
capabilities = ["i2v"]
endpoint = "https://router.huggingface.co"
integration_status = "unavailable"
billing_note = "No permanent free I2V quota is guaranteed; enable only after account/provider availability is verified."
availability_note = "Registered extension slot; no runtime adapter enabled yet."

[providers.registry.hosted_tts_slot]
display_name = "Hosted TTS Plugin Slot"
kind = "hosted"
enabled = false
experimental = true
credential_env = "HOSTED_TTS_API_KEY"
capabilities = ["tts"]
integration_status = "unavailable"
billing_note = "No provider is enabled: keep local Kokoro/espeak-ng as the default."
availability_note = "Reserved generic plugin slot; requires an explicitly selected provider adapter."

[fallback]
llm = "local_then_nim"
vision = "local_then_nim"
t2i = "local_only"
i2i = "local_only"
i2v = "local_only"
tts = "local_only"
max_retries = 1
log_path = "logs/provider_fallbacks.jsonl"

[animation]
enabled = false # stage3c LTX animation + stage_vlm_review clip review (false = panels-only Ken Burns mode)
panels_zoom = 1.08 # Ken Burns zoom amount when enabled=false (1.0 = no zoom)
panels_fade_s = 0.4 # fade in/out seconds at each shot boundary when enabled=false
refs_per_character_cap = 0 # stage1r refs/char cap; QUICK TEST sets ~4 so the whole pipeline finishes < 1 hour (0 = unlimited)
panel_max_regens = 0 # stage3b vision-judge retry cap; QUICK TEST sets 1 = accept after one enhanced re-render (0 = profile default: krea2 3 / flux 2)
quick_critique_iterations = 0 # stage0 scene quality loop depth; QUICK TEST sets 1 = accept first draft (~3x fewer LLM calls)
engine = "ltx2b"     # stage3c engine; requires a passing local smoke marker before production use
ltx_director_workflow = "ltx_director_23.json"   # LTXDirector V2V template (8GB GGUF, tiled VAE decode; panel keyframe + text beat + END frame)
enhance_panels = true        # Real-ESRGAN 2x source panels before I2V (reduces face/char distortion)
panel_char_ref = true        # stage3b: re-render panels conditioned on character ref (identity lock)
ltx_strength = 0.55          # LTX-2B I2V strength: lower = less face drift, higher = more motion
drift_axis = "vertical"
max_animated_seconds_per_block = 60.0
default_motion_tier = 1
panel_max_attempts = 4          # stage3b regenerates failing panels until all pass (seed-per-attempt)
ai_upscale = true              # Real-ESRGAN anime 2x on LTX clips (stage3c post-process)
ai_upscale_scale = 2          # 768x448 -> 1536x896, so stage5 DOWNscales into 1280x720 (sharper)
ai_upscale_model = "realesr-animevideov3-x2"

[automation]
auto_approve_blueprint = true
auto_advance_stages = true
allow_missing_loras = true   # kohya unavailable on Linux — scorecard-logged deviation

# ── Paths ─────────────────────────────────────────────────────────────────
[paths]
vault       = "/home/amire/Documents/Obsidian Vault"
output_dir  = "/home/amire/Documents/olympus-output"
wiki_root   = "llm-wiki-workflow"

# ── AGI script scorer (script-quality relationships) ─────────────────────
# Sits on top of Ollama script work: scores semantic relationships between
# script texts (fidelity to beats, causal flow, character consistency).
# Device: "auto" (cuda if free VRAM >= 3GB, else cpu) | "cpu" | "cuda".
# Checkpoint: vendored copy of the trained AGI Brain V3 (git-ignored *.pt).
[agi]
checkpoint_path = "olympus/engines/pipeline/models/agi_checkpoint_v3_fixed_best.pt"
device = "auto"
sbert_model = "all-MiniLM-L6-v2"

# ── GPU ───────────────────────────────────────────────────────────────────
[gpu]
vram_gb = 8
# Ollama and ComfyUI must never share GPU — stage transitions unload first

# ── NVIDIA NIM (hosted judge) ─────────────────────────────────────────────
# Two-mode operation:
#   1. "local" (default): All generation runs on this machine (Ollama + ComfyUI).
#      Ollama and ComfyUI must not run simultaneously (see GPU config).
#   2. "nvidia": Heavy LLM/vision/image work is offloaded to the free NVIDIA
#      Build API. The local 8GB card stays free for ComfyUI image generation.
#      Requires NVIDIA_API_KEY env var or .agent-secrets/nvidia_key.
#      The dashboard ENGINE toggle switches between these modes (persisted in stack.toml).
# LOCAL-ONLY default: disabled. Pipeline uses local Ollama qwen2.5vl:7b for VLM review.
# Enable only if you want hosted NIM (requires NVIDIA_API_KEY). Keep fully local on 8GB.
# tools/nim_calibrate.py forces this ON at runtime for a one-shot calibration sweep,
# then the pipeline returns to the local judge (retire the hosted VLM after calibrating).
# Endpoint verified live 2026-09-11: integrate.api.nvidia.com/v1. Working models
# (free tier, 200): deepseek-ai/deepseek-v4-pro-0813 (text) + meta/llama-3.2-11b-vision-instruct
# (vision). meta/llama-3.2-90b-vision-instruct times out (>60s) and no longer resolves.
[nim]
base_url = "https://integrate.api.nvidia.com/v1"
model = "meta/llama-3.2-11b-vision-instruct"
vision_model = "meta/llama-3.2-11b-vision-instruct"
text_model = "deepseek-ai/deepseek-v4-pro-0813"
timeout_seconds = 600
api_key = ""
# Generation engine: "local" (Ollama + ComfyUI, default) or "nvidia" (offload
# heavy LLM/vision/image work to the free NVIDIA Build API, freeing the 8GB
engine = "local"
# card for ComfyUI). Flip from the Studio banner ENGINE toggle (persisted here).
# When engine is "nvidia", these offload flags are automatically set true:
# When engine is "local", these follow the values below:
offload_llm = false
# NIM vision judge (llama-3.2-11b-vision) consistently 504-timeouts per panel,
# wasting up to 10min/panel on the 600s timeout before falling back to local.
# Use the fast local qwen2.5vl judge directly for panel/clip QC.
offload_vision = false
offload_images = false

# Verified 2026-09-11 by tools/nvidia_probe.py — only models that
# successfully responded on free-tier NIM without 529/timeout errors.
models = [
  "deepseek-ai/deepseek-v4-pro-0813",
  "meta/llama-3.2-11b-vision-instruct",
]
