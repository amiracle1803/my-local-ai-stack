# Local AI Stack — unified configuration
# Single source of truth. Every service and script reads from this file.

[stack]
name = "my-local-ai-stack"
version = "3.0.0"

# ── Ollama ────────────────────────────────────────────────────────────────
[ollama]
host = "127.0.0.1"
port = 11434
url = "http://127.0.0.1:11434"
timeout_seconds = 300
# Context window for pipeline LLM calls. Ollama's vram-based default (4096)
# is too small for the stage 0-2 prompts + JSON output; 16k is a good balance
# on 8GB VRAM (qwen3:8b offloads a few layers to CPU, still usable).
num_ctx = 16384

# Model roles — change these to swap models without touching code
[ollama.models]
script    = "qwen3:8b"           # all screenplay / story LLM work
vision = "qwen2.5vl:7b"       # panel vision judge — must be a VLM (qwen3:8b rejects image payloads with 400; qwen2.5vl occasionally miscounts dense panels but retry cap accepts best attempt)
review    = "qwen2.5vl:7b"       # stage_vlm_review 10-dim physics/logic gate (non‑reasoning; reliable fast structured output — qwen3‑vl:8b reasoning model returns empty content on some frames)
default   = "qwen3:8b"        # general fallback (was llama3.1:8b — not pulled on this box)
embed     = "nomic-embed-text"   # embeddings

# Agent roles — maps kernel agent roles → Ollama models
[ollama.agents]
triage   = "llama3.2:3b"
worker   = "qwen3:8b"
planner  = "qwen3:8b"
verifier = "llama3.2:3b"
jarvis   = "qwen3:8b"

# ── ComfyUI ───────────────────────────────────────────────────────────────
[comfyui]
host = "0.0.0.0"
port = 8188
url = "http://127.0.0.1:8188"

# Image models (GGUF in ComfyUI/models/unet/) — all LOCAL, 8GB-tested
[comfyui.models]
primary            = "flux-2-klein-4b-Q4_K_M.gguf" # 8GB-safe primary (2.5GB GGUF, Flux2-klein, verified on RTX 4070 8GB)
fallback = "flux-2-klein-4b-Q4_K_M.gguf" # 8GB-safe fallback (same file — no OOM fallback needed)
floor      = "flux-2-klein-4b-Q4_K_M.gguf"     # acceptable quality
panel               = "flux-2-klein-4b-Q4_K_M.gguf" # panel gen (flux-2-klein 4B, 8 steps, cfg 1.0)
character = "flux-2-klein-4b-Q4_K_M.gguf" # character sheets (flux-2-klein)
animation_primary = "ltx-2.3-22b-distilled-1.1-Q4_K_M.gguf" # 17GB GGUF but validated 8GB-safe via tiled VAE (768x448x81f ~5.8GB per manifest ltx22b_i2v.json) — hunyuan 7.4GB is fallback

# Banned checkpoints — enforced at runtime by pipeline.config.resolve_image_model
banned_checkpoints = [
  "z-anime-distill-4step-fp8",
  "wai-illustrious-v110",
  "NoobAI-XL-v1.1",
  "animagine-xl-4.0",
  "FLUX.1-Krea-dev",
]

# ── Voice Studio ──────────────────────────────────────────────────────────
[voice]
host = "127.0.0.1"
port = 5050
url = "http://127.0.0.1:5050"

# ── Olympus Kernel ────────────────────────────────────────────────────────
[kernel]
host = "0.0.0.0"
port = 4600
url = "http://127.0.0.1:4600"
core_agents = ["jarvis", "archivist", "plutus", "conductor"]

# ── OpenCode MCP ──────────────────────────────────────────────────────────
[mcp]
host = "127.0.0.1"
port = 4720

# ── Open WebUI ────────────────────────────────────────────────────────────
[webui]
host = "0.0.0.0"
port = 8080
url = "http://127.0.0.1:8080"

# ── llama.cpp server (optional) ───────────────────────────────────────────
[llamacpp]
host = "127.0.0.1"
port = 8081
enabled = false

# ── Pipeline ──────────────────────────────────────────────────────────────
[pipeline]
projects_dir = "olympus/engines/pipeline/projects"
loras_dir    = "olympus/engines/pipeline/loras"
workflows    = "olympus/engines/pipeline/workflows"
comfyui_dir  = "ComfyUI"

[animation]
engine = "ltx2b"     # PRIMARY stage3c engine: aetherpunk LTX Director V2V (First&Last-Frame directed motion; fixes static clips). Fallbacks: "ltx2b" | "hunyuan" | "wan22" | "ltx23"
ltx_director_workflow = "ltx_director_23.json"   # LTXDirector V2V template (8GB GGUF, tiled VAE decode; panel keyframe + text beat + END frame)
enhance_panels = true        # Real-ESRGAN 2x source panels before I2V (reduces face/char distortion)
panel_char_ref = true        # stage3b: re-render panels conditioned on character ref (identity lock)
ltx_strength = 0.55          # LTX-2B I2V strength: lower = less face drift, higher = more motion
drift_axis = "vertical"
max_animated_seconds_per_block = 60.0
default_motion_tier = 1
panel_max_attempts = 4          # stage3b regenerates failing panels until all pass (seed-per-attempt)
ai_upscale = true              # Real-ESRGAN anime 2x on LTX clips (stage3c post-process)
ai_upscale_scale = 2          # 768x448 -> 1536x896, so stage5 DOWNscales into 1280x720 (sharper)
ai_upscale_model = "realesr-animevideov3-x2"

[automation]
auto_approve_blueprint = true
auto_advance_stages = true
allow_missing_loras = true   # kohya unavailable on Linux — scorecard-logged deviation

# ── Paths ─────────────────────────────────────────────────────────────────
[paths]
vault       = "/home/amire/Documents/Obsidian Vault"
output_dir  = "/home/amire/Documents/olympus-output"
wiki_root   = "llm-wiki-workflow"

# ── AGI script scorer (script-quality relationships) ─────────────────────
# Sits on top of Ollama script work: scores semantic relationships between
# script texts (fidelity to beats, causal flow, character consistency).
# Device: "auto" (cuda if free VRAM >= 3GB, else cpu) | "cpu" | "cuda".
# Checkpoint: vendored copy of the trained AGI Brain V3 (git-ignored *.pt).
[agi]
enabled = true
checkpoint_path = "olympus/engines/pipeline/models/agi_checkpoint_v3_fixed_best.pt"
device = "auto"
sbert_model = "all-MiniLM-L6-v2"

# ── GPU ───────────────────────────────────────────────────────────────────
[gpu]
name = "RTX 4070 Laptop"
vram_gb = 8
# Ollama and ComfyUI must never share GPU — stage transitions unload first

# ── NVIDIA NIM (hosted judge) ─────────────────────────────────────────────
# LOCAL-ONLY default: disabled. Pipeline uses local Ollama qwen2.5vl:7b for VLM review.
# Enable only if you want hosted NIM (requires NVIDIA_API_KEY). DeepSeek model is
# listed as opt-in but NOT active by default — keeps the pipeline fully local on 8GB.
# When enabled, stack.toml [nim] model is patched via Studio UI or CLI without an agent.
[nim]
enabled = false
base_url = "https://integrate.api.nvidia.com/v1"
model = "nvidia/llama-3.1-nemotron-nano-vl-8b-v1"
api_key = ""
timeout_seconds = 120

# Available NIM models for selection
# DeepSeek models via NVIDIA NIM
models = [
  "nvidia/llama-3.1-nemotron-nano-vl-8b-v1",
  "deepseek-ai/deepseek-v4-flash-0731",
]
