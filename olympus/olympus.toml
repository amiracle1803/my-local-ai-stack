# Olympus kernel config (rebuilt 2026-07-09 after the original was lost).
# Model roles map role names -> installed Ollama models. Agents reference
# roles, never model names, so swapping a model is a one-line change here.
#
# Original mapping (per hermes olympus-instance-notes.md) used qwen2.5:3b /
# qwen2.5:7b / qwen3:8b. Only llama3.1:8b is pulled right now, so every role
# points at it. To restore the original split:
#   ollama pull qwen2.5:3b && ollama pull qwen2.5:7b && ollama pull qwen3:8b
# then edit the roles below.

[models]
triage   = "llama3.1:8b"   # originally qwen2.5:3b
worker   = "llama3.1:8b"   # originally qwen2.5:7b
planner  = "llama3.1:8b"   # originally qwen3:8b
verifier = "llama3.1:8b"   # originally qwen2.5:3b
jarvis   = "llama3.1:8b"   # originally qwen2.5:7b
embed    = "nomic-embed-text"

[ollama]
base_url = "http://127.0.0.1:11434"
timeout_seconds = 300

[paths]
# Agents may READ the vault but must never write to it. Artifacts go to output_dir.
vault      = "/run/media/amirel/Amir1tb SSD/Obsidian Vault"
output_dir = "/run/media/amirel/Amir1tb SSD/LifeOS/_Inbox/olympus-output"
wiki_root  = "../llm-wiki-workflow"

[kernel]
host = "0.0.0.0"
port = 4600
# Agents that can never be deleted via the API:
core_agents = ["scribe", "conductor", "calliope", "plutus", "forge", "archivist"]
