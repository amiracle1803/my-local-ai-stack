<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storyboard</title>
<style>
/* Layout: a night-sky reel. Each scene = its finished cut beside the storyboard it was strung from,
   a to-scale shot timeline under the player, then the shots in order with every key frame. */
:root {
  color-scheme: dark;
  --night: #0c1428;          /* page: deep sky */
  --night-2: #142142;        /* raised surfaces */
  --cloud: #22305a;          /* hairlines, empty track */
  --ink: #ece5d4;            /* warm paper */
  --muted: #98a3c2;          /* blue-grey secondary text */
  --lantern: #f0a43c;        /* accent: lantern flame */
  --scarf: #e0614f;          /* speaker names */
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Noto Serif JP", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-1: .8125rem; --s0: 1rem; --s1: 1.25rem; --s2: 1.75rem; --s3: clamp(2.2rem, 6vw, 3.6rem);
}
* { box-sizing: border-box; }
body {
  background: var(--night); color: var(--ink); font: 400 var(--s0)/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
header.ep { padding-block: 48px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 28px;
  align-items: end; border-bottom: 1px solid var(--cloud); }
header.ep .titles { display: grid; gap: 10px; }
.thumb { width: min(340px, 100%); aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block; }
.thumb-wrap { display: grid; gap: 6px; }
.thumb-wrap span { font: 400 11px/1 var(--mono); color: var(--muted); }
.eyebrow { font: 500 var(--s-1)/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--lantern); }
h1 { font: 800 var(--s3)/1.05 var(--display); margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font: 400 var(--s-1)/1.4 var(--mono); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 500; }
nav.scenes { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--night);
  display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; border-bottom: 1px solid var(--cloud); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
nav.scenes a { flex: none; color: var(--ink); text-decoration: none; font: 500 var(--s-1)/1 var(--body);
  padding: 9px 14px; border: 1px solid var(--cloud); border-radius: 999px; }
nav.scenes a span { font-family: var(--mono); color: var(--lantern); margin-right: 8px; }
nav.scenes a:hover, nav.scenes a:focus-visible { border-color: var(--lantern); outline: none; }
section.scene { padding-block: 44px 8px; display: grid; gap: 22px; scroll-margin-top: 64px; }
.scene-head { display: grid; gap: 6px; max-width: 70ch; }
.scene-head .num { font: 500 var(--s-1)/1 var(--mono); color: var(--lantern); letter-spacing: .12em; }
h2 { font: 600 var(--s2)/1.15 var(--display); margin: 0; text-wrap: balance; }
.scene-head p { margin: 0; color: var(--muted); }
.cut { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.player { display: grid; gap: 10px; }
video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; }
.track { display: flex; height: 26px; gap: 2px; }
.track button { all: unset; cursor: pointer; position: relative; background: var(--cloud); border-radius: 2px; min-width: 3px; }
.track button i { position: absolute; inset: 0; background: var(--lantern); opacity: 0; border-radius: 2px; transition: opacity .2s; }
.track button.on i { opacity: .9; }
.track button:hover, .track button:focus-visible { background: #34477e; }
.track button b { position: absolute; bottom: 3px; left: 4px; font: 500 10px/1 var(--mono); color: var(--muted); pointer-events: none; }
.track button.on b { color: var(--night); }
.legend { display: flex; justify-content: space-between; color: var(--muted); font: 400 var(--s-1)/1.3 var(--mono); font-variant-numeric: tabular-nums; }
.now { background: var(--night-2); border-radius: 6px; padding: 16px 18px; display: grid; gap: 8px; min-height: 100%; }
.now .sid { font: 500 var(--s-1)/1 var(--mono); color: var(--muted); }
.now .narr { margin: 0; color: var(--muted); font-style: italic; }
.now .say { margin: 0; font-size: var(--s1); line-height: 1.4; }
.who { color: var(--scarf); font: 700 var(--s-1)/1 var(--body); letter-spacing: .1em; text-transform: uppercase; }
.who em { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
ol.shots { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
li.shot { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding-block: 18px; border-top: 1px solid var(--cloud); }
li.shot.on .label .id { color: var(--lantern); }
.label { display: grid; gap: 6px; align-content: start; font: 400 var(--s-1)/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.label .id { color: var(--ink); font-weight: 500; }
.label button { all: unset; cursor: pointer; color: var(--lantern); font: 500 var(--s-1)/1 var(--mono); }
.label button:hover, .label button:focus-visible { text-decoration: underline; }
.body { display: grid; gap: 10px; min-width: 0; }
.frames { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.frames figure { margin: 0; flex: 0 0 auto; width: min(260px, 70vw); display: grid; gap: 4px; }
.frames button { all: unset; cursor: zoom-in; display: block; border-radius: 4px; overflow: hidden; }
.frames button:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
.frames img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
.frames figcaption { font: 400 11px/1 var(--mono); color: var(--muted); }
.lines { display: grid; gap: 4px; max-width: 72ch; }
.lines .narr { margin: 0; color: var(--muted); font-style: italic; }
.lines .say { margin: 0; }
dialog { border: 0; padding: 0; background: transparent; max-width: min(1400px, 96vw); }
dialog::backdrop { background: rgba(5, 9, 20, .88); }
dialog img { width: 100%; display: block; border-radius: 6px; }
dialog p { color: var(--ink); font: 400 var(--s-1)/1.4 var(--mono); margin: 8px 0 0; }
footer { margin-top: 40px; color: var(--muted); font: 400 var(--s-1)/1.5 var(--mono); border-top: 1px solid var(--cloud); padding-top: 16px; }
@media (max-width: 760px) {
  header.ep { grid-template-columns: 1fr; }
  .cut { grid-template-columns: 1fr; }
  li.shot { grid-template-columns: 1fr; gap: 10px; }
  .label { grid-auto-flow: column; justify-content: start; gap: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
</style></head><body>

<div class="wrap">
  <header class="ep">
    <div class="titles">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="thumb-wrap" id="thumbwrap" hidden><img class="thumb" id="thumb" alt="Generated episode thumbnail"><span>Generated thumbnail</span></div>
  </header>
  <nav class="scenes" id="nav" aria-label="Scenes"></nav>
  <main id="scenes"></main>
  <footer id="foot"></footer>
</div>
<dialog id="zoom"><img alt=""><p></p></dialog>

<script>
const DATA = /*DATA*/null;
const $ = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) k === "text" ? e.textContent = v : e.setAttribute(k, v); e.append(...kids); return e; };
const tc = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
document.title = `${DATA.title} · storyboard`;
document.getElementById("eyebrow").textContent = DATA.eyebrow;
document.getElementById("title").textContent = DATA.title;
const all = DATA.scenes.flatMap(s => s.shots);
const total = DATA.scenes.at(-1).end;
document.getElementById("meta").innerHTML =
  `<span><b>${tc(total)}</b> runtime</span><span><b>${DATA.scenes.length}</b> scenes</span>` +
  `<span><b>${all.length}</b> shots</span><span><b>${all.reduce((n, s) => n + s.frames.length, 0)}</b> key frames</span>` +
  `<span>1920×1080 master · hq profile</span>`;
if (DATA.thumb) { document.getElementById("thumb").src = DATA.thumb; document.getElementById("thumbwrap").hidden = false; }
const zoom = document.getElementById("zoom");
zoom.addEventListener("click", () => zoom.close());

function lineNodes(sh) {
  const out = [];
  if (sh.narration) out.push($("p", { class: "narr", text: sh.narration }));
  if (sh.line) {
    const who = $("span", { class: "who", text: sh.speaker });
    if (sh.delivery) who.append(" ", $("em", { text: `(${sh.delivery})` }));
    out.push($("p", { class: "say" }, who, " ", sh.line));
  }
  return out;
}

for (const sc of DATA.scenes) {
  const id = `scene-${sc.n}`;
  document.getElementById("nav").append($("a", { href: `#${id}` }, $("span", { text: String(sc.n).padStart(2, "0") }), sc.title));
  let t = 0;
  const starts = sc.shots.map(sh => { const s = t; t += sh.seconds; return s; });
  const video = $("video", { controls: "", preload: "metadata", playsinline: "", src: sc.video });
  const track = $("div", { class: "track", role: "group", "aria-label": `Scene ${sc.n} shots, to scale` });
  const now = $("div", { class: "now", "aria-live": "polite" });
  const items = [];
  const seek = i => { video.currentTime = starts[i] + 0.05; video.play().catch(() => {}); };
  sc.shots.forEach((sh, i) => {
    const b = $("button", { style: `flex:${sh.seconds}`, title: `${sh.id} · ${sh.seconds}s · ${sh.frames.length} frame${sh.frames.length > 1 ? "s" : ""}`, "aria-label": `Play ${sh.id}` }, $("i"));
    if (sh.seconds >= 6) b.append($("b", { text: sh.id.slice(-5) }));
    b.onclick = () => seek(i);
    track.append(b);
    const frames = $("div", { class: "frames" });
    sh.frames.forEach((src, k) => {
      const btn = $("button", { "aria-label": `Enlarge ${sh.id} frame ${k + 1}` }, $("img", { src, alt: `${sh.id} frame ${k + 1}`, loading: "lazy" }));
      btn.onclick = () => { zoom.querySelector("img").src = src; zoom.querySelector("p").textContent = `${sh.id} · frame ${k + 1} of ${sh.frames.length}`; zoom.showModal(); };
      frames.append($("figure", {}, btn, $("figcaption", { text: k ? `f${k + 1}` : "panel" })));
    });
    const play = $("button", { text: `▶ ${tc(sc.start + starts[i])}` });
    play.onclick = () => seek(i);
    const li = $("li", { class: "shot" },
      $("div", { class: "label" }, $("span", { class: "id", text: sh.id }), $("span", { text: `${sh.seconds.toFixed(1)} s · ${sh.frames.length} fr` }), play),
      $("div", { class: "body" }, frames, $("div", { class: "lines" }, ...lineNodes(sh))));
    items.push([b, li]);
  });
  let cur = -1;
  const show = i => {
    if (i === cur) return; cur = i;
    items.forEach(([b, li], j) => { b.classList.toggle("on", j === i); li.classList.toggle("on", j === i); });
    const sh = sc.shots[i];
    now.replaceChildren($("span", { class: "sid", text: `${sh.id} · ${tc(sc.start + starts[i])}` }), ...lineNodes(sh));
  };
  video.addEventListener("timeupdate", () => { let i = 0; while (i + 1 < starts.length && video.currentTime >= starts[i + 1]) i++; show(i); });
  show(0);
  document.getElementById("scenes").append($("section", { class: "scene", id },
    $("div", { class: "scene-head" }, $("span", { class: "num", text: `SCENE ${String(sc.n).padStart(2, "0")} · ${tc(sc.start)}–${tc(sc.end)}` }),
      $("h2", { text: sc.title }), $("p", { text: sc.summary })),
    $("div", { class: "cut" }, $("div", { class: "player" }, video, track,
      $("div", { class: "legend" }, $("span", { text: `${sc.shots.length} shots` }), $("span", { text: `${(sc.end - sc.start).toFixed(1)} s` }))), now),
    $("ol", { class: "shots" }, ...items.map(([, li]) => li))));
}
document.getElementById("foot").textContent = `${DATA.slug} · built by the pipeline (stage5) · click a frame to enlarge it, or a bar in the timeline to play that shot.`;
</script>
</body></html>
