# Anime Pipeline v2 - engine config (design sections 0, 0.2, 5.3b).
# All model roles are config, not code. LLM roles default to the recommended
# per-role models from design section 0; llm_default (llama3.1:8b) is the only
# model currently pulled and is the fallback until qwen3:8b / qwen2.5vl:7b are
# pulled (design open question 8).

[models]
# --- LLM roles (Ollama) ---
llm_script = "qwen3:8b"          # all script/screenplay LLM work (design s0)
llm_vision = "qwen2.5vl:7b"      # panel vision analysis
llm_default = "llama3.1:8b"      # current fallback (only model pulled locally)

# --- Image generation ---
image_primary = "krea2"                       # MANDATED primary (design s0). Must pass model_lab before any image stage.
image_fallback = "flux1-schnell-Q4_K_S.gguf"  # only permitted fallback (design s0 / 5.3b)

# --- Other engines ---
tts = "kokoro"                                # Voice Studio :5050
animation_primary = "Wan2.2-TI2V-5B-fp8"      # KJ build (design s0)

# MODEL BAN LIST (Amir, 2026-07-09, design 5.3b). These may NEVER be selected
# for image generation. resolve_image_model() raises BannedModelError on any
# of these.
banned = ["z-anime-distill-4step-fp8", "wai-illustrious-v110", "NoobAI-XL-v1.1"]

# Automation-first policy (design 0.2). Every stage auto-advances by default;
# the original spec's human touchpoints only pause when their flag is false or
# a hard gate trips (legal < 50, blocking appearance contradiction, >20% panel
# vision failures).
[automation]
auto_approve_blueprint = true
auto_approve_transform_map = true
auto_approve_identity = true
auto_resolve_contradictions = true
auto_advance_stages = true

# Animation / motion (design 3C).
[animation]
drift_axis = "vertical"                 # Tier-0 oscillating drift axis (Ken Burns banned)
max_animated_seconds_per_block = 60.0   # motion budget cap for Tier 1-2 spend
default_motion_tier = 1                  # Tier 1 LTX ambient is the floor for every shot

# Paths. Relative paths resolve against the pipeline engine root
# (the directory containing this file). Absolute paths used as-is.
[paths]
projects = "projects"                    # per-story artifacts (gitignored)
loras = "E:/AI/Models/loras"             # trained LoRA checkpoints
comfyui = "C:/AI/ComfyUI"                # primary ComfyUI install
