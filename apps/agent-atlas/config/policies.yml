# Guardian Agent — Policy Rules
# Each rule defines a pattern and a decision (allow/block/warn).
# Rules are evaluated top-to-bottom; first match wins.

rules:
  # Always block destructive shell commands
  - id: block_rm_rf
    description: Block recursive delete commands
    match:
      tool: shell_exec
      args_contains: "rm -rf"
    decision: block
    reason: "Recursive deletion is permanently destructive."

  - id: block_drop_table
    description: Block SQL DROP TABLE statements
    match:
      tool: shell_exec
      args_contains: "DROP TABLE"
    decision: block
    reason: "Database table drops are irreversible."

  # Warn on external network calls from code agent
  - id: warn_external_http
    description: Warn before code agent makes external HTTP calls
    match:
      agent: code_agent
      tool: http_get
    decision: warn
    reason: "Code agent making external HTTP call — verify intent."

  # Block sending email without explicit approval
  - id: block_send_email
    description: Block automated email sends
    match:
      tool: send_email
    decision: block
    reason: "Email sends require explicit user approval."

  # Block deploy to production without approval
  - id: block_prod_deploy
    description: Block production deployments
    match:
      tool: deploy
      args_contains: "production"
    decision: block
    reason: "Production deployments require manual sign-off."

  # Allow all local file reads
  - id: allow_file_read
    match:
      tool: file_read
    decision: allow

  # Allow Obsidian appends
  - id: allow_obsidian_append
    match:
      tool: obsidian_append
    decision: allow

  # Default: allow everything not explicitly matched
  - id: default_allow
    description: Default permissive policy
    match: {}
    decision: allow
    reason: "No specific policy matched — allowing by default."
