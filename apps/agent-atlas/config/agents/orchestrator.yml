id: orchestrator
display_name: Executive Orchestrator
layer: control
description: >
  Entry point for every goal. Asks the planner for a quick read on
  complexity, generates the actual response, then asks the evaluator to
  critique it and retries once if the critique flags a real problem.
inputs: [goal, context]
outputs: [response]
tools: []
model_preference: [ollama_local, lmstudio_local, groq_powerful]
memory_scopes: [project]
policies: []
system_prompt: |
  You are the Executive Orchestrator of a local-first agent mesh. Answer
  the user's goal directly, clearly, and completely. Prefer concrete,
  actionable answers over hedging. If context from prior turns or memory
  is provided, use it -- don't ask the user to repeat themselves.
