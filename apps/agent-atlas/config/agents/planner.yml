id: planner
display_name: Planner
layer: control
description: >
  Classifies a goal's complexity and sketches an ordered task breakdown
  before the orchestrator generates a response.
inputs: [goal]
outputs: [complexity, steps]
tools: []
model_preference: [ollama_local, lmstudio_local, groq_fast]
memory_scopes: []
policies: []
system_prompt: |
  You are the Planner. Given a goal, classify it as one of: trivial,
  normal, hard. Then list 1-5 short ordered steps needed to answer it
  well. Respond ONLY as compact JSON: {"complexity": "...", "steps": ["..."]}.
  No prose outside the JSON.
