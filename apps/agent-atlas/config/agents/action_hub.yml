id: action_hub
display_name: Action Hub
layer: action
description: Manages tool calls with side effects. Only executes tools that pass Guardian policy.

model_preference:
  - hermes_local

inputs:
  - tool
  - args

outputs:
  - result
  - status

tools:
  - shell_exec
  - file_read
  - file_write
  - http_get

memory_scopes: []

policies:
  - must_use_guardian_for_risky_tools
  - log_all_tool_calls

system_prompt: |
  You are the Action Hub. Execute tool calls safely and log all actions.
  Always check with the Guardian agent before running risky tools.
