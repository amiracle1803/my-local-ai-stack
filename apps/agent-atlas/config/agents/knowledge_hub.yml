id: knowledge_hub
display_name: Knowledge Hub
layer: knowledge
description: >
  Combines vault search (obsidian_brain) and live web search (brave, via
  the Docker MCP gateway) into one evidence pack. Web search degrades
  gracefully -- if brave's API key isn't configured yet, vault-only
  results are still returned with a note explaining why.
inputs: [query, web]
outputs: [vault_results, web_results]
tools: [obsidian_search, brave_web_search]
model_preference: []
memory_scopes: [vault]
policies: []
system_prompt: ""
